<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Groups</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    
   <div class="container">
     <h2 class="display-4 text-center my-4 font-weight-bold bg-primary p-2">Buttons & Button Groups</h2>
   </div>
    <hr>
    <div class="container">
    <!--BUTTONS-->
    <button class="btn btn-primary" type="button">Primary</button>
    <button class="btn btn-secondary" type="button">Secondary</button>
    <button class="btn btn-success" type="button">Success</button>
    <button class="btn btn-info" type="button">Info</button>
    <button class="btn btn-warning" type="button">Warning</button>
    <button class="btn btn-danger" type="button">Danger</button>
    <button class="btn btn-link" type="button">Link</button>
        <br><br>
    <!--BUTTON TAGS-->
    <a class="btn btn-primary" href="#" role="button">Link</a>
    <button class="btn btn-danger">Button</button>
    <input class="btn btn-warning" type="button" value="Input">
    <input class="btn btn-info" type="submit" value="submit">
    <input class="btn btn-secondary" type="reset" value="Reset">
        <br><br>
    <!--OUTLINE BUTTON-->
    <button class="btn btn-outline-primary" type="button">Primary</button>
    <button class="btn btn-outline-secondary" type="button">Secondary</button>
    <button class="btn btn-outline-success" type="button">Success</button>
    <button class="btn btn-outline-info" type="button">Info</button>
    <button class="btn btn-outline-warning" type="button">Warning</button>
    <button class="btn btn-outline-danger" type="button">Danger</button>

    <br><br>
    
    <!--BUTTON SIZE-->
    <button class="btn btn-primary btn-lg" type="button"><i class="fa fa-envelope mr-1"></i>Large Button</button>
    <button class="btn btn-success btn-sm" type="button">Small button</button>
    <br><br>
    <button class="btn btn-danger btn-block" type="button">Block level button</button>
    <br><br>

    <!--STATES-->
    <button class="btn btn-primary" type="button">Regular Button</button>
    <button class="btn btn-primary active" type="button">Active Button</button>
    <button class="btn btn-primary disabled" type="button">Disablde Button</button>
    <button type="button" class="btn btn-primary mt-2 btn-toggle" data-toggle="button">Toggle State</button>
        <br><br>
    
    <!--BUTTON DROPDOWNS-->
    <div class="dropdown">
        <button type="button" class="btn btn-success dropdown-toggle" data-toggle="dropdown">My Dropdown</button>
        <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Link One</a>
            <a class="dropdown-item" href="#">Link Two</a>
            <a class="dropdown-item" href="#">Link Three</a>
        </div>
    </div>
    <br><br>

    <!--SPLIT DROPDOWNS-->
    <div class="btn-group">
        <button class="btn btn-primary" type="button">My Button</button>
        <button class="btn btn-primary dropdown-toggle dropdown-toggle-split" data-toggle="dropdown" type="button">
            <span class="sr-only">Toggle Dropdown</span>
        </button>
        <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Link One</a>
            <a class="dropdown-item" href="#">Link Two</a>
            <a class="dropdown-item" href="#">Link Three</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="#">Link Four</a>
        </div>
    </div>
    <br><br>

    <!--BUTTON GROUPS-->
    <div class="btn-group">
        <button class="btn btn-primary" type="button">Left</button>
        <button class="btn btn-secondary" type="button">Middle</button>
        <button class="btn btn-primary" type="button">Right</button>
    </div>
    <br>
    <br>

    <div class="btn-toolbar" role="toolbar">
        <div class="btn-group mr-2">
            <button class="btn btn-primary" type="button">1</button>
            <button class="btn btn-primary" type="button">2</button>
            <button class="btn btn-primary" type="button">3</button>
            <button class="btn btn-primary" type="button">4</button>
        </div>
        <div class="btn-group mr-2">
            <button class="btn btn-primary" type="button">5</button>
            <button class="btn btn-primary" type="button">6</button>
            <button class="btn btn-primary" type="button">7</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" type="button">8</button>
        </div>  
    </div>
    <br><br>

    <div class="btn-group-vertical">
        <button class="btn btn-success" type="button">Left</button>
        <button class="btn btn-danger" type="button">Middle</button>
        <button class="btn btn-success" type="button">Right</button>
    </div>
    <br><br>
    <div class="dropdown dropup">
        <button class="btn btn-primary dropdown-toggle" data-toggle="dropdown" type="button">My Dropdown</button>

        <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Link One</a>
            <a class="dropdown-item" href="#">Link Two</a>
            <a class="dropdown-item" href="#">Link Three</a>
        </div>
    </div>
    
    <div style="margin-top: 500px;"></div>
    </div>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>

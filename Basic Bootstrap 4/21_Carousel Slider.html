<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Slider</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <h1 class="display-4 text-center my-4 font-weight-bold">Carousel Slider</h1>
    <div class="container">
        <!--################ START HEARE #################-->

        <!--SLIDER-->
        <div id="slider1" class="carousel slide" data-ride="carousel">
             <ol class="carousel-indicators">
                <li class="active" data-target="#slider1" data-slide-to="0"></li>
                <li data-target="#slider1" data-slide-to="1"></li>
                <li data-target="#slider1" data-slide-to="2"></li>
             </ol>
            <div class="carousel-inner" role="listbox">
                <div class="carousel-item active">
                    <img src="images/30450-B.JPG" class="d-block img-fluid" alt="First Slide">
                    <div class="carousel-caption">
                        <h3>Looking Good</h3>
                        <p>Lorem ipsum dolor sit amet.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="images/30461-G.JPG" class="d-block img-fluid" alt="Second Slide">
                    <div class="carousel-caption">
                        <h3>Very Nice</h3>
                        <p>Lorem ipsum dolor sit amet. Lorem ipsum dolor sit amet consectetur adipisicing elit. Minus, magni.</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="images/30465-B.jpg" class="d-block img-fluid" alt="Second Slide">
                    <div class="carousel-caption">
                        <h3>Thank You</h3>
                        <p>Lorem ipsum dolor sit amet.</p>
                    </div>
                </div>

            </div>
            <a href="#slider1" class="carousel-control-prev" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a href="#slider1" class="carousel-control-next" data-slide="next">
                <span class="carousel-control-next-icon"></span>
            </a>
        </div>

    </div>


    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="js/bootstrap.min.js"></script>
    <script>
        $('.carousel').carousel({
            interval : 2000,
            wrap : true,
            keyboard: true
        });
    </script>
    
</body>
</html>

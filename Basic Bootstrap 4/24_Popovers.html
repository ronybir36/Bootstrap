<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popovers</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <h1 class="display-4 text-center my-4 font-weight-bold">Popovers</h1>

    <div class="container">

        <!--Popovers-->
        <button class="btn btn-sm btn-primary" data-toggle="popover" title="Hello world" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias, fugit. " data-placement="top">Toggle popover</button>

        <button class="btn btn-sm btn-success" data-toggle="popover" title="Hello world" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias, fugit. " data-placement="right">Toggle popover</button>

        <button class="btn btn-sm btn-warning" data-toggle="popover" title="Hello world" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias, fugit. " data-placement="bottom">Toggle popover</button>

        <button class="btn btn-sm btn-info" data-toggle="popover" title="Hello world" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias, fugit. " data-placement="left">Toggle popover</button>

        <br><br>

        <!--DISMISSIBLE POPOVER-->
        <button id="myPopover1" class="btn btn-sm btn-danger" data-trigger="focus" data-toggle="popover" title="Hello world" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias, fugit. " data-placement="left">Toggle popover</button>
        <br>
        <hr>

        <!--Control with js-->
        <button class="btn btn-secondary btn-sm" onclick="showPopover()">Show popover</button>

        <button class="btn btn-secondary btn-sm" onclick="hidePopover()">hide popover</button>
    </div>

    <div style="margin-top: 500px;"></div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="js/bootstrap.min.js"></script>

    <script>
        $('[data-toggle="popover"]').popover();
        
        function showPopover(){
            $('#myPopover1').popover('show');
            
        }
        function hidePopover(){
            $('#popover1').popover('hide');
            
        }
    </script>
    
    
</body>
</html>
